<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#111c3d" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#2563eb" stroke-width="1.5" />

  <!-- Code bracket emblem GWS < / > -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 23 22 L 15 32 L 23 42" fill="none" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Slash / -->
    <line x1="36" y1="18" x2="28" y2="46" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
    
    <!-- Right Bracket > -->
    <path d="M 41 22 L 49 32 L 41 42" fill="none" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

